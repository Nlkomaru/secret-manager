name: "Load Secrets"
description: "Zero-config secret loader with hierarchical overriding for nlkomaru repositories"
inputs:
  aws-account-id:
    description: "AWS Account ID (defaults to your AWS account ID)"
    required: false
    default: "161381425016"
  role-name:
    description: "IAM Role name configured for GitHub Actions OIDC"
    required: false
    default: "github-actions-ssm-role"
  role-arn:
    description: "Explicit AWS IAM Role ARN (overrides aws-account-id and role-name if provided)"
    required: false
    default: ""
  aws-region:
    description: "AWS Region"
    required: false
    default: "ap-northeast-1"
  project:
    description: "Project name (defaults to repository name)"
    required: false
    default: ""
  env:
    description: "Environment name (e.g. production, preview)"
    required: false
    default: ""
  export-env:
    description: "Whether to export loaded secrets to GITHUB_ENV"
    required: false
    default: "true"
  export-json:
    description: "Path to export secrets as a JSON file (e.g. runner-temp/secrets.json)"
    required: false
    default: ""
  export-json-keys:
    description: "Newline- or comma-separated keys to include in the export-json file (defaults to all keys). Fails if a listed key is missing."
    required: false
    default: ""
  keys:
    description: "Newline- or comma-separated keys to load and export (defaults to all project keys; fails if a listed key is missing)."
    required: false
    default: ""
  shared-keys:
    description: "Newline- or comma-separated keys to load from shared/ and shared/<env>/ (defaults to none unless listed here or in keys)."
    required: false
    default: ""

outputs:
  secrets-json:
    description: "All merged secrets as a JSON string"
    value: ${{ steps.load.outputs.secrets_json }}

runs:
  using: "composite"
  steps:
    - name: Determine Role ARN
      id: role
      shell: bash
      env:
        EXPLICIT_ARN: ${{ inputs.role-arn }}
        ACCOUNT_ID: ${{ inputs.aws-account-id }}
        ROLE_NAME: ${{ inputs.role-name }}
      run: |
        if [ -n "$EXPLICIT_ARN" ]; then
          echo "arn=$EXPLICIT_ARN" >> "$GITHUB_OUTPUT"
        else
          echo "arn=arn:aws:iam::${ACCOUNT_ID}:role/${ROLE_NAME}" >> "$GITHUB_OUTPUT"
        fi

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ steps.role.outputs.arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Fetch and Merge SSM Parameters
      id: load
      shell: bash
      env:
        AWS_REGION: ${{ inputs.aws-region }}
        PROJECT: ${{ inputs.project }}
        TARGET_ENV: ${{ inputs.env }}
        EXPORT_ENV: ${{ inputs.export-env }}
        EXPORT_JSON_PATH: ${{ inputs.export-json }}
        EXPORT_JSON_KEYS: ${{ inputs.export-json-keys }}
        KEYS: ${{ inputs.keys }}
        SHARED_KEYS: ${{ inputs.shared-keys }}
      run: |
        set -euo pipefail

        # Default PROJECT to repository name if not provided
        PROJECT="${PROJECT:-${GITHUB_REPOSITORY#*/}}"

        TMP_DIR="$(mktemp -d)"
        trap 'rm -rf "$TMP_DIR"' EXIT

        fetch_params() {
          local target_path="${1%/}"
          local out_file="$2"
          echo "Fetching SSM parameters from: $target_path" >&2

          local res
          # Windows (Git Bash / MSYS2) では /github/... が C:/Program Files/Git/github/... に変換されるのを aws 実行時のみ無効化する
          if ! res=$(MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL="*" aws ssm get-parameters-by-path \
            --region "$AWS_REGION" \
            --path "$target_path" \
            --with-decryption \
            --output json); then
            echo "{}" > "$out_file"
            return 0
          fi

          local prefix="${target_path}/"
          # jq.exe も Windows ネイティブバイナリのため --arg prefix が MSYS2 でパス変換されないよう無効化する
          echo "$res" | MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL="*" jq -c --arg prefix "$prefix" '
            [ .Parameters[]?
              | select(.Name | startswith($prefix))
              | select((.Name | ltrimstr($prefix) | contains("/") | not))
              | { (.Name | ltrimstr($prefix)): .Value }
            ] | add // {}
          ' > "$out_file"
        }

        # 探索するパス階層（後ろが前を上書き）
        # v2: shared は shared-keys または keys が指定された場合のみ読み込む
        if [ -n "$SHARED_KEYS" ] || [ -n "$KEYS" ]; then
          # 1. /github/nlkomaru/shared (全体共通)
          fetch_params "/github/nlkomaru/shared" "$TMP_DIR/1_shared.json"

          # 2. /github/nlkomaru/shared/<env> (環境共通)
          if [ -n "$TARGET_ENV" ]; then
            fetch_params "/github/nlkomaru/shared/$TARGET_ENV" "$TMP_DIR/2_shared_env.json"
          else
            echo "{}" > "$TMP_DIR/2_shared_env.json"
          fi

          # shared-keys のみ指定されている場合は shared をそのキーだけに絞る
          if [ -n "$SHARED_KEYS" ]; then
            for f in "$TMP_DIR/1_shared.json" "$TMP_DIR/2_shared_env.json"; do
              jq -c --arg keys "$SHARED_KEYS" '
                ($keys | split("[\\s,]+"; null) | map(select(. != ""))) as $wanted
                | with_entries(select(.key | IN($wanted[])))
              ' "$f" > "${f}.tmp" && mv "${f}.tmp" "$f"
            done
          fi
        else
          echo "{}" > "$TMP_DIR/1_shared.json"
          echo "{}" > "$TMP_DIR/2_shared_env.json"
        fi

        # 3. /github/nlkomaru/<project> (プロジェクト共通)
        fetch_params "/github/nlkomaru/$PROJECT" "$TMP_DIR/3_project.json"

        # 4. /github/nlkomaru/<project>/<env> (プロジェクト環境固有)
        if [ -n "$TARGET_ENV" ]; then
          fetch_params "/github/nlkomaru/$PROJECT/$TARGET_ENV" "$TMP_DIR/4_project_env.json"
        else
          echo "{}" > "$TMP_DIR/4_project_env.json"
        fi

        # 階層順にマージ (1 -> 2 -> 3 -> 4)
        MERGED_JSON=$(jq -s '.[0] * .[1] * .[2] * .[3]' \
          "$TMP_DIR/1_shared.json" \
          "$TMP_DIR/2_shared_env.json" \
          "$TMP_DIR/3_project.json" \
          "$TMP_DIR/4_project_env.json")

        echo "Loaded $(jq 'length' <<< "$MERGED_JSON") parameter(s): $(jq -r 'keys | join(", ")' <<< "$MERGED_JSON")" >&2

        # keys が指定されている場合はそのキーだけに絞り、不足があればエラーにする
        if [ -n "$KEYS" ]; then
          MERGED_JSON=$(jq -ec --arg keys "$KEYS" '
            ($keys | split("[\\s,]+"; null) | map(select(. != ""))) as $wanted
            | ($wanted - keys) as $missing
            | if ($missing | length) > 0
              then error("keys not found: \($missing | join(", "))")
              else with_entries(select(.key | IN($wanted[])))
              end
          ' <<< "$MERGED_JSON")
        elif [ -n "$SHARED_KEYS" ]; then
          # shared-keys の不足チェック
          jq -e --arg keys "$SHARED_KEYS" '
            ($keys | split("[\\s,]+"; null) | map(select(. != ""))) as $wanted
            | ($wanted - keys) as $missing
            | if ($missing | length) > 0
              then error("shared-keys not found: \($missing | join(", "))")
              else true
              end
          ' <<< "$MERGED_JSON" > /dev/null
        fi

        # 1. ログ伏字（add-mask）処理
        jq -r 'to_entries[] | .value' <<< "$MERGED_JSON" | while IFS= read -r val; do
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              echo "::add-mask::$line"
            fi
          done <<< "$val"
        done

        # 2. GITHUB_ENV へのエクスポート
        # Windows (Git Bash + jq.exe) では NUL 区切り + read -d '' が壊れるため、
        # jq で直接 GITHUB_ENV のヒアドキュメント形式を生成する。
        if [ "$EXPORT_ENV" = "true" ]; then
          delimiter="GHENV_$(openssl rand -hex 16 | tr -d '\r\n')"
          jq -r --arg delim "$delimiter" '
            to_entries[] | "\(.key)<<\($delim)\n\(.value)\n\($delim)"
          ' <<< "$MERGED_JSON" | tr -d '\r' >> "$GITHUB_ENV"
        fi

        # 3. JSON ファイルへのエクスポート (指定時)
        if [ -n "$EXPORT_JSON_PATH" ]; then
          mkdir -p "$(dirname "$EXPORT_JSON_PATH")"
          if [ -n "$EXPORT_JSON_KEYS" ]; then
            jq -e --arg keys "$EXPORT_JSON_KEYS" '
              ($keys | split("[\\s,]+"; null) | map(select(. != ""))) as $wanted
              | ($wanted - keys) as $missing
              | if ($missing | length) > 0
                then error("export-json-keys not found: \($missing | join(", "))")
                else with_entries(select(.key | IN($wanted[])))
                end
            ' <<< "$MERGED_JSON" > "$EXPORT_JSON_PATH"
          else
            echo "$MERGED_JSON" > "$EXPORT_JSON_PATH"
          fi
          echo "Exported secrets JSON to: $EXPORT_JSON_PATH" >&2
        fi

        # 4. Step output のセット
        EOF_DELIMITER="$(openssl rand -hex 16 | tr -d '\r\n')"
        {
          echo "secrets_json<<${EOF_DELIMITER}"
          echo "$MERGED_JSON"
          echo "${EOF_DELIMITER}"
        } >> "$GITHUB_OUTPUT"
